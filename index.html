<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English 8 – Practice</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#1d2433;color:#eef2f8;padding:28px 16px 40px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:34px;margin:0 0 4px}
  .sub{color:#a9b4c8;margin:0 0 24px;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  a.tile{display:block;text-decoration:none;color:inherit;border-radius:16px;padding:20px;min-height:170px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
  a.tile:active{transform:scale(.98)}
  .icon{font-size:44px;line-height:1}
  .topic{display:inline-block;margin-top:12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px}
  .name{font-size:22px;font-weight:700;margin-top:8px}
  .info{font-size:15px;opacity:.85;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 English 8</h1>
  <p class="sub">Choose an exercise. – Wähle eine Übung.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
/* Neue Übungen hier eintragen (neueste oben) */
const EXERCISES = [
  {file:"if-clauses.html", icon:"🚀", topic:"If clauses (type I)", name:"Mission Orion", info:"Repair the space station and fly home.", color:"linear-gradient(135deg,#16224a,#2b4a8f)"},
  {file:"one-ones.html", icon:"🕵️", topic:"one / ones", name:"The Camden Market Camera Case", info:"Talk to the witnesses and find the thief.", color:"linear-gradient(135deg,#4a3a22,#8a6a36)"}
];
document.getElementById("grid").innerHTML = EXERCISES.map(e=>`
  <a class="tile" href="${e.file}" style="background:${e.color}">
    <div class="icon">${e.icon}</div>
    <div class="topic">${e.topic}</div>
    <div class="name">${e.name}</div>
    <div class="info">${e.info}</div>
  </a>`).join("");
</script>
</body>
</html>
