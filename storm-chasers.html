<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Storm Chasers – Modal auxiliaries</title>
<style>
  :root{--bg:#1b2026;--panel:#252c35;--txt:#eef3f8;--muted:#9fb0c2;--yellow:#ffd23a;--ok:#5ee68f;--bad:#ff5f5f;--rival:#ff5a3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,#3a4452 0%,#1b2026 55%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;padding-bottom:40px}
  main{max-width:880px;margin:0 auto;padding:12px 14px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  a.back{color:var(--muted);text-decoration:none;font-size:15px}
  .panel{background:var(--panel);border:1px solid #3a4656;border-radius:16px;padding:18px;margin-top:12px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
  h1{font-size:32px;margin:8px 0 6px;letter-spacing:.02em}
  .tag{display:inline-block;background:var(--yellow);color:#222;font-weight:800;font-size:13px;letter-spacing:.12em;padding:3px 10px;border-radius:4px}
  .de{color:var(--muted);font-size:15px;font-style:italic;margin-top:3px}
  .map{position:relative;height:150px;border-radius:14px;overflow:hidden;margin-top:10px;background:linear-gradient(180deg,#5b6778 0%,#7a8a9c 45%,#a8b86a 46%,#8aa04e 100%)}
  .road{position:absolute;left:0;right:0;top:92px;height:30px;background:#3b3f45;border-top:2px solid #2a2d31;border-bottom:2px solid #2a2d31}
  .road:after{content:"";position:absolute;left:0;right:0;top:13px;height:3px;background:repeating-linear-gradient(90deg,#ffd23a 0 18px,transparent 18px 34px)}
  .lane{position:absolute;left:0;right:0;height:46px;transition:none}
  .car{position:absolute;transition:left .7s cubic-bezier(.3,1.4,.6,1);width:70px}
  .car .av{position:absolute;left:18px;top:-30px;width:34px;height:34px;border-radius:50%;overflow:hidden;border:2px solid #fff;background:#000}
  .tw{position:absolute;right:6px;top:0;width:90px;height:120px}
  .fields{position:absolute;left:0;right:0;top:124px;height:30px;display:flex;justify-content:space-around;font-size:16px;opacity:.8}
  .stats{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:15px;color:var(--muted);flex-wrap:wrap}
  .radio{display:flex;gap:12px;align-items:flex-start;background:#1a2028;border-left:4px solid var(--yellow);padding:12px 14px;border-radius:10px;margin:14px 0;font-size:20px}
  .radio .ic{font-size:30px}
  .opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .btn{font-size:19px;padding:12px 18px;border-radius:12px;border:2px solid #4a5a70;background:#2e3846;color:var(--txt);cursor:pointer;font-weight:600}
  .btn:active{transform:translateY(2px)}
  .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#222}
  .btn.right{border-color:var(--ok);color:var(--ok);background:#163a26}
  .btn.wrong{border-color:var(--bad);color:var(--bad);background:#3a1616;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--yellow);text-align:center;font-weight:800;color:var(--yellow);padding:0 6px}
  .gap.ok{color:var(--ok);border-color:var(--ok)}
  input.ty{font-size:21px;padding:8px 12px;border-radius:10px;border:2px solid var(--yellow);background:#141920;color:var(--txt);width:220px;font-weight:700}
  input.ty.ok{border-color:var(--ok);color:var(--ok)} input.ty.bad{border-color:var(--bad);animation:shake .35s}
  .hintv{color:var(--muted);font-size:16px}
  .fb{min-height:28px;margin-top:12px;font-weight:700}
  .fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .center{text-align:center}
  .small{font-size:14px;color:var(--muted)}
  .rain{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.05) 0 1px,transparent 1px 12px);animation:rain .5s linear infinite;z-index:0;opacity:.6}
  @keyframes rain{to{background-position:-12px 24px}}
  main{position:relative;z-index:1}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
  .ov.show{display:flex}.ov .panel{max-width:660px;max-height:88vh;overflow:auto}
  table.rule{width:100%;border-collapse:collapse;margin:8px 0;font-size:16px}
  table.rule td,table.rule th{border:1px solid #4a5a70;padding:6px 8px;text-align:left;vertical-align:top}
  table.rule th{background:#2e3846}
</style>
</head>
<body>
<div class="rain"></div>
<main id="app"></main>
<div class="ov" id="ov" onclick="if(event.target===this)this.classList.remove('show')"><div class="panel" id="ovc"></div></div>
<script src="game.js?v=6"></script>
<script>
const GAME = "modals-storm", KEY = "stormchasers", GOAL = 14, RIVAL_SECS = 20;
const Q = [
  { t: "pick", r: "Base", s: "Careful! You ___ drive on the farmland. It's private land.", o: ["aren't allowed to", "don't have to", "weren't able"], a: 0 },
  { t: "pick", r: "Base", s: "Yesterday you ___ stop for gas in Dodge City, right?", o: ["must", "had to", "have to"], a: 1 },
  { t: "pick", r: "Base", s: "The road was closed, so the other team ___ take the highway.", o: ["couldn't", "didn't have to", "can't"], a: 0 },
  { t: "pick", r: "Base", s: "___ you able to see the clouds from there?", o: ["Do", "Can", "Are"], a: 2 },
  { t: "pick", r: "Base", s: "You ___ hurry yet – the storm is still 50 miles away.", o: ["aren't allowed to", "don't have to", "didn't have to"], a: 1 },
  { t: "pick", r: "Your partner Sam", s: "Last year I ___ film a tornado for the first time!", o: ["am able to", "had", "was able to"], a: 2 },
  { t: "pick", r: "Base", s: "Storm chasers ___ always listen to the weather radio.", o: ["have to", "has to", "are allowed"], a: 0 },
  { t: "pick", r: "Your partner Sam", s: "___ you have to drive all night last time?", o: ["Were", "Did", "Do"], a: 1 },
  { t: "type", r: "Your partner Sam", s: "Last night we ___ sleep in the car.", v: "müssen", a: ["had to"] },
  { t: "type", r: "Your partner Sam", s: "The wind was so strong that I ___ open the door.", v: "nicht können", a: ["couldn't", "could not", "wasn't able to", "was not able to"] },
  { t: "type", r: "Farmer Jones", s: "Last week the chasers ___ use their drones on my farm.", v: "nicht dürfen", a: ["weren't allowed to", "were not allowed to"] },
  { t: "type", r: "Your partner Sam", s: "My little brother ___ come with us. He's too young.", v: "nicht müssen – Ersatzform!", a: ["doesn't have to", "does not have to"] },
  { t: "type", r: "Base", s: "You ___ park here. The sign says 'Storm chasers welcome'.", v: "dürfen", a: ["are allowed to", "can"] },
  { t: "type", r: "Your partner Sam", s: "Look! I ___ see the tornado!", v: "können", a: ["can", "am able to"] },
  { t: "kind", r: "Your partner Sam", s: "Sam can drive a big truck.", a: "ab" },
  { t: "kind", r: "Base", s: "You can stop at the gas station for free coffee.", a: "pe" }
];
const $ = id => document.getElementById(id);
let S = null, timer = null;
const me = () => { const s = E8.getSession(); return s ? s.nr : null; };
const norm = s => s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, " ").trim();
function save() { try { sessionStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function load() { try { const x = JSON.parse(sessionStorage.getItem(KEY)); if (x) S = x; } catch (e) { } }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fb(m, g) { const f = $("fb"); f.className = "fb " + (g ? "good" : "bad"); f.innerHTML = m; }

function rules() {
  $("ovc").innerHTML = `<span class="tag">Chaser's handbook</span><h2>Modal auxiliaries & substitutes</h2>
  <table class="rule"><tr><th></th><th>Present</th><th>Past</th></tr>
  <tr><td><b>können</b></td><td>can / am, is, are able to</td><td>could / was, were able to</td></tr>
  <tr><td><b>dürfen</b></td><td>can / am, is, are allowed to</td><td>could / was, were allowed to</td></tr>
  <tr><td><b>müssen</b></td><td>must / have to, has to<br><b>nicht müssen:</b> don't / doesn't have to</td><td>had to · didn't have to</td></tr></table>
  <p class="small">Questions: Are you allowed to …? · Were you able to …? · Did you have to …?</p>
  <button class="btn primary" onclick="$('ov').classList.remove('show')">Got it!</button>`;
  $("ov").classList.add("show");
}
function carSVG(col) {
  return `<svg viewBox="0 0 70 34" width="70"><path d="M6 22 L10 12 Q12 8 18 8 L44 8 Q50 8 54 14 L62 16 Q68 17 68 22 L68 26 L4 26 Z" fill="${col}" stroke="#111" stroke-width="1.5"/><path d="M16 12 L22 10 L40 10 L46 15 L16 15 Z" fill="#bfe6ff"/><rect x="24" y="3" width="14" height="5" rx="1" fill="#ffd23a"/><circle cx="18" cy="27" r="6" fill="#222"/><circle cx="54" cy="27" r="6" fill="#222"/><circle cx="18" cy="27" r="2.5" fill="#999"/><circle cx="54" cy="27" r="2.5" fill="#999"/></svg>`;
}
const tornado = `<svg viewBox="0 0 90 120" class="tw"><g><ellipse cx="45" cy="14" rx="42" ry="10" fill="#4a5260"/><ellipse cx="46" cy="34" rx="32" ry="8" fill="#5a6270"/><ellipse cx="48" cy="52" rx="23" ry="7" fill="#6a7280"/><ellipse cx="50" cy="70" rx="15" ry="6" fill="#7a8290"/><ellipse cx="52" cy="86" rx="9" ry="5" fill="#8a929e"/><ellipse cx="54" cy="100" rx="5" ry="4" fill="#9aa2ae"/><animateTransform attributeName="transform" type="skewX" values="-6;6;-6" dur="1.2s" repeatCount="indefinite"/></g></svg>`;
function pos(n) { return `calc(${Math.min(n, GOAL) / GOAL} * (100% - 160px) + 4px)`; }
function mapHTML() {
  return `<div class="map">${tornado}<div class="road"></div>
    <div class="car" id="rival" style="left:${pos(S.rival)};top:70px">${carSVG("#ff5a3a")}</div>
    <div class="car" id="mine" style="left:${pos(S.me)};top:96px">${carSVG("#ffd23a")}<div class="av">${E8.myAvatar()}</div></div>
    <div class="fields"><span>🌾</span><span>🐄</span><span>🌽</span><span>🏚️</span><span>🌾</span></div></div>
    <div class="stats"><span>🟡 You: <b>${S.me}</b> / ${GOAL} miles</span><span>🔴 Team Twister: <b>${Math.min(S.rival, GOAL)}</b> / ${GOAL}</span><span>Mistakes: ${S.mistakes}</span></div>`;
}
function updMap() { if ($("mine")) { $("mine").style.left = pos(S.me); $("rival").style.left = pos(S.rival); } }

function intro() {
  $("app").innerHTML = `<div class="top"><a class="back" href="./">← All exercises</a><span class="small">Unit 2 · Modal auxiliaries</span></div>
  <div class="panel">
    <span class="tag">TORNADO ALLEY · KANSAS</span><h1>Storm Chasers</h1>
    <div class="map" style="height:130px">${tornado}<div class="road" style="top:80px"></div><div class="car" style="left:30px;top:58px">${carSVG("#ffd23a")}<div class="av">${E8.myAvatar()}</div></div><div class="car" style="left:120px;top:58px">${carSVG("#ff5a3a")}</div></div>
    <p>A huge tornado is coming! You and your partner Sam want to film it – but <b>Team Twister</b> wants the same footage. Every correct answer takes you <b>one mile</b> closer. Every mistake = flat tire, and Team Twister gets ahead!</p>
    <p class="de">Jede richtige Antwort bringt dich eine Meile weiter. Bei Fehlern holt Team Twister auf. Das Rivalen-Team fährt auch so weiter – beeil dich, aber denk nach!</p>
    <div class="row"><button class="btn primary" id="go">🚙 Start the engine</button><button class="btn" onclick="rules()">📘 Handbook</button></div>
  </div>`;
  $("go").onclick = () => { S = { nr: me(), q: shuffle(Q.map((_, i) => i)), me: 0, rival: 0, mistakes: 0, total: GOAL, start: Date.now(), end: 0, done: false, won: null }; save(); render(); };
}
function resume() {
  $("app").innerHTML = `<div class="top"><a class="back" href="./">← All exercises</a></div><div class="panel center"><h1>Welcome back!</h1><p>Someone has already started this chase on this iPad. – Hier hat schon jemand angefangen.</p>
  <div class="row" style="justify-content:center"><button class="btn primary" id="c">Continue</button><button class="btn" id="n">I'm a new player</button></div></div>`;
  $("c").onclick = render; $("n").onclick = () => { S = null; try { sessionStorage.removeItem(KEY); } catch (e) { } intro(); };
}
function startRival() {
  clearInterval(timer);
  timer = setInterval(() => { if (!S || S.done) return clearInterval(timer); if (S.rival < GOAL) { S.rival++; save(); updMap(); const st = document.querySelector(".stats"); if (st) st.children[1].innerHTML = `🔴 Team Twister: <b>${Math.min(S.rival, GOAL)}</b> / ${GOAL}`; } }, RIVAL_SECS * 1000);
}
function render() {
  if (S.done) return finish();
  startRival();
  const q = Q[S.q[0]];
  let body = "";
  if (q.t === "pick") { const [a, b] = q.s.split("___"); body = `<div class="radio"><div class="ic">📻</div><div><b>${q.r}:</b> “${a}<span class="gap" id="gap">&nbsp;?&nbsp;</span>${b}”</div></div><div class="opts">${shuffle(q.o.map((o, i) => [o, i])).map(([o, i]) => `<button class="btn" data-i="${i}">${o}</button>`).join("")}</div>`; }
  if (q.t === "type") { const [a, b] = q.s.split("___"); body = `<div class="radio"><div class="ic">📻</div><div><b>${q.r}:</b> “${a}<input class="ty" id="ty" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${b}” <span class="hintv">(${q.v})</span></div></div><button class="btn primary" id="chk">Drive! 🚙</button>`; }
  if (q.t === "kind") body = `<div class="radio"><div class="ic">📻</div><div><b>${q.r}:</b> “${q.s}”<div class="small">What does <b>can</b> mean here? – Was bedeutet „can“ hier?</div></div></div><div class="opts"><button class="btn" data-k="ab">💪 ability – können</button><button class="btn" data-k="pe">✅ permission – dürfen</button></div>`;
  $("app").innerHTML = `<div class="top"><a class="back" href="./">← All exercises</a><button class="btn" style="font-size:15px;padding:7px 12px" onclick="rules()">📘 Handbook</button></div>
  <div class="panel">${mapHTML()}${body}<div class="fb" id="fb"></div></div>`;
  let locked = false;
  const right = (msg) => {
    locked = true; S.me++; S.q.shift(); fb("✔ " + (msg || "Correct! Vroom! 🚙"), true);
    if (S.me >= GOAL) { S.done = true; S.end = Date.now(); S.won = S.rival < GOAL; clearInterval(timer); }
    save(); updMap(); setTimeout(render, 1100);
  };
  const wrong = (msg) => {
    S.mistakes++; S.rival++; const i = S.q.shift(); S.q.splice(Math.min(3, S.q.length), 0, i); save(); updMap();
    fb("✘ 💥 Flat tire! " + msg); locked = true; setTimeout(render, 2600);
  };
  document.querySelectorAll(".opts .btn").forEach(b => b.onclick = () => {
    if (locked) return;
    if (q.t === "pick") {
      if (+b.dataset.i === q.a) { b.classList.add("right"); $("gap").textContent = q.o[q.a]; $("gap").classList.add("ok"); right(); }
      else { b.classList.add("wrong"); wrong(`Correct: <b>${q.o[q.a]}</b>. This one comes back later. <span class="small">– Die Aufgabe kommt nochmal.</span>`); }
    } else {
      if (b.dataset.k === q.a) { b.classList.add("right"); right(); }
      else { b.classList.add("wrong"); wrong(q.a === "ab" ? "Sam is <b>able</b> to drive it → ability." : "It's OK to do it → permission (= are allowed to)."); }
    }
  });
  if ($("ty")) {
    $("ty").focus();
    const go = () => {
      if (locked) return; const v = norm($("ty").value); if (!v) return;
      if (q.a.map(norm).includes(v)) { $("ty").classList.add("ok"); right("Correct!" + (q.a.length > 1 ? ` <span class="small">Also possible: ${q.a.filter(x => norm(x) !== v).slice(0, 2).join(" / ")}</span>` : "")); }
      else { $("ty").classList.add("bad"); wrong(`Correct: <b>${q.a[0]}</b>${q.a[1] ? " / " + q.a[1] : ""}. This one comes back later. <span class="small">– Die Aufgabe kommt nochmal.</span>`); }
    };
    $("chk").onclick = go; $("ty").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  }
}
function finish() {
  clearInterval(timer);
  const sec = Math.round((S.end - S.start) / 1000);
  $("app").innerHTML = `<div class="top"><a class="back" href="./">← All exercises</a></div>
  <div class="panel center">${mapHTML()}
    <h1>${S.won ? "🏆 You got the best footage!" : "🎥 You filmed the tornado!"}</h1>
    <p>${S.won ? "You were faster than Team Twister. Your video will be on TV tonight!" : "Team Twister was a little faster this time – but you still got great pictures. Try again to beat them!"}</p>
    <div style="width:130px;margin:0 auto;border-radius:50%;overflow:hidden;border:4px solid var(--yellow)">${E8.myAvatar()}</div>
    <p>Mistakes: <b>${S.mistakes}</b> · Time: <b>${Math.floor(sec / 60)} min ${sec % 60} s</b></p>
    <div id="coinbox" style="margin:12px auto;padding:12px;background:#1a2028;border:1px solid var(--yellow);border-radius:12px;max-width:460px"></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="again">New player / play again</button><button class="btn" onclick="location.href='./'">← All exercises</button></div></div>`;
  E8.reportInto("coinbox", GAME, S, save);
  $("again").onclick = () => { S = null; try { sessionStorage.removeItem(KEY); } catch (e) { } intro(); };
}
load();
if (S && me() && S.nr !== me()) { S = null; try { sessionStorage.removeItem(KEY); } catch (e) { } }
if (S && S.done) finish(); else if (S && (S.me > 0 || S.mistakes > 0)) resume(); else intro();
</script>
</body>
</html>
