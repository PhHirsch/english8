<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>The Time Machine – Modal auxiliaries</title>
<style>
  :root{--bg:#1a1410;--panel:#2a2018;--txt:#f6eedc;--muted:#c2ad8a;--brass:#d9a441;--ok:#6fe39a;--bad:#ff6b6b;--now:#4fc3ff;--then:#e0a05a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;padding-bottom:40px;transition:background 1s;
    background:radial-gradient(ellipse at 50% 0%,#3d2c1c 0%,var(--bg) 65%)}
  body.then{background:radial-gradient(ellipse at 50% 0%,#5a4022 0%,#2a1c10 70%)}
  body.now{background:radial-gradient(ellipse at 50% 0%,#14365a 0%,#0c1424 70%)}
  main{max-width:860px;margin:0 auto;padding:12px 14px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  a.back{color:var(--muted);text-decoration:none;font-size:15px}
  .parts{display:flex;gap:6px;align-items:center}
  .parts span{width:38px;height:38px;border-radius:10px;border:2px dashed #6a5638;display:grid;place-items:center;font-size:20px;opacity:.5}
  .parts span.got{border:2px solid var(--brass);opacity:1;background:#3a2c18;box-shadow:0 0 12px rgba(217,164,65,.5)}
  .me{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--brass)}
  .panel{background:var(--panel);border:2px solid #5a4626;border-radius:18px;padding:20px;margin-top:12px;box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 40px rgba(217,164,65,.06)}
  body.now .panel{background:#14223a;border-color:#2c4a78}
  .era{display:inline-block;padding:4px 14px;border-radius:20px;font-weight:800;letter-spacing:.1em;font-size:14px}
  .era.then{background:#6a4a22;color:#ffd9a0}.era.now{background:#1f4a7a;color:#bfe6ff}.era.lab{background:#4a3a5a;color:#e6d0ff}
  h1{font-size:32px;margin:10px 0 6px;font-family:Georgia,"Times New Roman",serif}
  h2{font-size:25px;margin:10px 0 4px;font-family:Georgia,serif}
  .de{color:var(--muted);font-size:15px;font-style:italic;margin-top:3px}
  .npc{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.25);border-left:4px solid var(--brass);padding:12px 14px;border-radius:10px;margin:14px 0}
  .npc .ic{font-size:38px;line-height:1}
  .task{margin:14px 0 4px;font-weight:700}
  .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:16px;margin:12px 0;font-size:22px;line-height:1.6}
  .gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--brass);text-align:center;font-weight:800;color:var(--brass);padding:0 6px}
  .gap.ok{color:var(--ok);border-color:var(--ok)}
  .opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .btn{font-size:19px;padding:12px 18px;border-radius:12px;border:2px solid #7a6440;background:#3a2c1c;color:var(--txt);cursor:pointer;font-weight:600}
  body.now .btn{border-color:#3a6aa0;background:#1a2e4c}
  .btn:active{transform:translateY(2px)}
  .btn.primary{background:var(--brass);border-color:var(--brass);color:#2a1a00}
  .btn.right{border-color:var(--ok)!important;color:var(--ok)!important;background:#143a24!important}
  .btn.wrong{border-color:var(--bad)!important;color:var(--bad)!important;background:#3a1414!important;animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fb{min-height:28px;margin-top:12px;font-weight:700}
  .fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}
  .dots{display:flex;gap:6px;margin-top:8px}.dots i{width:12px;height:12px;border-radius:50%;background:#5a4626;display:block}.dots i.done{background:var(--ok)}.dots i.now{background:var(--brass)}
  .bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  @media(max-width:600px){.bins{grid-template-columns:1fr}}
  .bin{border:2px solid #7a6440;border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#30241a;font-weight:700}
  .bin small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  input.ty{font-size:21px;padding:8px 12px;border-radius:10px;border:2px solid var(--brass);background:#1a120c;color:var(--txt);width:230px;font-weight:700}
  body.now input.ty{background:#0c1424}
  input.ty.ok{border-color:var(--ok);color:var(--ok)} input.ty.bad{border-color:var(--bad);animation:shake .35s}
  .answerline{min-height:62px;border:2px solid var(--brass);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;background:rgba(0,0,0,.2)}
  .answerline.wrong{border-color:var(--bad);animation:shake .35s}.answerline.right{border-color:var(--ok)}
  .pool{display:flex;flex-wrap:wrap;gap:8px;min-height:54px}
  .chip{font-size:20px;padding:9px 14px;border-radius:10px;background:#3a2c1c;border:2px solid #7a6440;cursor:pointer;font-weight:600}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .machine{display:flex;justify-content:center;margin:6px 0}
  .warp{position:fixed;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center;font-size:40px;font-weight:900;color:#fff;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,220,140,.6) 30%,rgba(80,40,120,.0) 70%);animation:warp 1.4s forwards}
  @keyframes warp{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(3)}}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
  .ov.show{display:flex}
  .ov .panel{max-width:680px;max-height:88vh;overflow:auto}
  table.rule{width:100%;border-collapse:collapse;margin:8px 0;font-size:16px}
  table.rule td,table.rule th{border:1px solid #5a4626;padding:6px 8px;text-align:left;vertical-align:top}
  table.rule th{background:#3a2c18}
  .small{font-size:14px;color:var(--muted)}
  .center{text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<div class="ov" id="ov" onclick="if(event.target===this)this.classList.remove('show')"><div class="panel" id="ovc"></div></div>
<script src="game.js?v=10"></script>
<script>
const GAME = "modals-time", KEY = "timemachine";
const PARTS = ["🔋", "💎", "⚙️", "🔌", "🗝️"];
const PARTNAME = ["Flux battery", "Time crystal", "Chrono gear", "Power cable", "Start key"];
const ST = [
  { type: "sort", era: "lab", title: "Station 1: Calibrate the machine", npc: ["👩‍🔬", "Dr. Kowalski", "The machine is confused! Tell it what each sentence is about: Can you DO it, are you ALLOWED to do it, or do you HAVE TO do it?"],
    task: "Tap the right box for each sentence.", de: "Fähigkeit (können), Erlaubnis (dürfen) oder Pflicht (müssen)?",
    items: [["I can swim really fast.", "ab"], ["You are allowed to use your phone at break.", "pe"], ["We have to wear safety glasses in the lab.", "ob"], ["She wasn't able to open the door.", "ab"], ["They weren't allowed to talk in class.", "pe"], ["He had to walk to school every day.", "ob"], ["Can I go to the toilet, please?", "pe"]] },
  { type: "pick", era: "then", title: "Station 2: Kansas, 1870 – the prairie school", npc: ["👩‍🏫", "Miss Parker, teacher", "Welcome to my little schoolhouse! Life is different here. Choose the right words – remember, it's the past!"],
    task: "Choose the correct past form.", de: "Vergangenheit: had to / didn't have to · was(n't) allowed to · could(n't) / was(n't) able to",
    items: [["In winter the children ___ bring wood for the stove.", ["had to", "must", "were able"], 0],
      ["They ___ talk during lessons. I was very strict!", ["didn't have to", "weren't allowed to", "can't"], 1],
      ["There was no electricity, so they ___ use computers.", ["didn't have to", "mustn't", "couldn't"], 2],
      ["Paper was expensive, so the children ___ write on small slates.", ["had to", "have to", "are allowed to"], 0],
      ["On Sundays they ___ go to school. They stayed at home.", ["weren't able", "didn't have to", "don't have to"], 1],
      ["Little Tom was clever. He ___ read when he was five.", ["had to", "is able to", "was able to"], 2]] },
  { type: "pick", era: "now", title: "Station 3: Kansas, today – Westwood High", npc: ["🧑🏽‍🎓", "Maya, a freshman", "Whoa, where did you come from?! I'll show you our school. Choose the right words – we're in the present now!"],
    task: "Choose the correct present form.", de: "Gegenwart: can / am, is, are able to · am, is, are (not) allowed to · have to / don't have to",
    items: [["We ___ wear a uniform. We can wear jeans!", ["don't have to", "aren't able", "didn't have to"], 0],
      ["You ___ use your phone in class. The rules are strict.", ["don't have to", "aren't allowed to", "weren't allowed to"], 1],
      ["All freshmen ___ take Math and English.", ["has to", "had to", "have to"], 2],
      ["My friend Jake ___ speak three languages.", ["can", "must", "is allowed"], 0],
      ["___ we allowed to eat in the library?", ["Do", "Are", "Have"], 1],
      ["Luckily I ___ stay after school today. No detention!", ["am not allowed to", "can't", "don't have to"], 2]] },
  { type: "type", era: "then", title: "Station 4: Then and now", npc: ["🤖", "TIMEBOT", "WARNING. TIME MIXED UP. Write what it was like in 1870. Use the past forms!"],
    task: "Complete the 1870 sentence.", de: "Schreibe die Vergangenheitsform. can → could / was able to · must → had to",
    items: [["Today kids can use computers.", "In 1870 they ___ use computers.", ["couldn't", "could not", "weren't able to", "were not able to"]],
      ["Today we have to wear seat belts in cars.", "In 1870 people ___ wear seat belts.", ["didn't have to", "did not have to"]],
      ["Today girls are allowed to play football at school.", "In 1870 girls ___ play football at school.", ["weren't allowed to", "were not allowed to"]],
      ["Today students must learn English.", "In 1870 the children ___ learn to read and write.", ["had to"]],
      ["Today you can travel by plane.", "In 1870 people ___ travel by train.", ["could", "were able to"]]] },
  { type: "order", era: "lab", title: "Station 5: The final repair", npc: ["👩‍🔬", "Dr. Kowalski", "Last step! The machine only starts with perfect sentences."],
    task: "Put the words in the right order.", de: "Tippe die Wörter in der richtigen Reihenfolge an. Nochmal tippen = zurück.",
    items: [["Did", "you", "have", "to", "help", "on", "the", "farm", "?"], ["We", "weren't", "allowed", "to", "leave", "the", "classroom", "."], ["I", "was", "able", "to", "fix", "the", "time", "machine", "!"]] }
];
const TOTAL = ST.reduce((a, s) => a + s.items.length, 0);
const $ = id => document.getElementById(id);
let S = null, item = 0;
const me = () => { const s = E8.getSession(); return s ? s.nr : null; };
function save() { try { sessionStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function load() { try { const x = JSON.parse(sessionStorage.getItem(KEY)); if (x) S = x; } catch (e) { } }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fb(m, g) { const f = $("fb"); f.className = "fb " + (g ? "good" : "bad"); f.innerHTML = m; }
function mistake() { S.mistakes++; save(); }
const norm = s => s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, " ").trim();

function rules() {
  $("ovc").innerHTML = `<span class="era lab">Machine manual</span><h2>Modal auxiliaries & substitutes</h2>
  <p class="small">Modalverben gibt es nur im simple present. Für andere Zeiten brauchst du Ersatzformen.</p>
  <table class="rule"><tr><th></th><th>Present</th><th>Past</th></tr>
  <tr><td><b>Fähigkeit</b><br><span class="small">können</span></td><td>can / am, is, are able to</td><td>could / was, were able to<br>couldn't / wasn't, weren't able to</td></tr>
  <tr><td><b>Erlaubnis</b><br><span class="small">dürfen</span></td><td>can / am, is, are allowed to<br>can't / isn't allowed to</td><td>could / was, were allowed to<br>couldn't / wasn't, weren't allowed to</td></tr>
  <tr><td><b>Pflicht</b><br><span class="small">müssen</span></td><td>must / have to, has to<br><b>nicht müssen: don't / doesn't have to</b></td><td>had to<br>didn't have to</td></tr></table>
  <p>Questions: <i>Are you allowed to …? · Was she able to …? · Did you have to …?</i></p>
  <button class="btn primary" onclick="$('ov').classList.remove('show')">Got it!</button>`;
  $("ov").classList.add("show");
}
function header() {
  return `<div class="top"><a class="back" href="./">← All exercises</a>
    <div class="parts">${PARTS.map((p, i) => `<span class="${S && i < S.st ? "got" : ""}" title="${PARTNAME[i]}">${p}</span>`).join("")}</div>
    <div class="row"><button class="btn" style="font-size:15px;padding:7px 12px" onclick="rules()">📘 Rules</button><div class="me">${E8.myAvatar()}</div></div></div>`;
}
function machineSVG(spin) {
  return `<svg viewBox="0 0 220 120" width="260"><defs><radialGradient id="mg"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#6a4a1a"/></radialGradient></defs>
  <rect x="30" y="70" width="160" height="40" rx="8" fill="#6a4a22" stroke="#d9a441" stroke-width="3"/>
  <circle cx="110" cy="60" r="44" fill="none" stroke="#d9a441" stroke-width="6"/><circle cx="110" cy="60" r="30" fill="url(#mg)"><animate attributeName="r" values="26;32;26" dur="${spin ? .6 : 2}s" repeatCount="indefinite"/></circle>
  <g stroke="#d9a441" stroke-width="3"><line x1="110" y1="16" x2="110" y2="6"/><line x1="66" y1="60" x2="56" y2="60"/><line x1="154" y1="60" x2="164" y2="60"/><animateTransform attributeName="transform" type="rotate" values="0 110 60;360 110 60" dur="${spin ? 1 : 6}s" repeatCount="indefinite"/></g>
  <circle cx="50" cy="90" r="6" fill="#ff5a3a"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></circle><circle cx="170" cy="90" r="6" fill="#4cff9a"/></svg>`;
}

function intro() {
  document.body.className = "";
  $("app").innerHTML = `<div class="top"><a class="back" href="./">← All exercises</a></div>
  <div class="panel">
    <span class="era lab">Unit 2 · Modal auxiliaries</span>
    <h1>The Time Machine</h1>
    <div class="machine">${machineSVG(false)}</div>
    <p>Dr. Kowalski, a science teacher in Kansas, has built a time machine in the school basement. You press the wrong button – <b>WHOOSH!</b> – and now the machine jumps between <b>1870</b> and <b>today</b>.</p>
    <p>Find the <b>5 missing parts</b> to get home. But careful: in the past you need past forms!</p>
    <p class="de">Finde die 5 Bauteile. In der Vergangenheit brauchst du Vergangenheitsformen, heute die Gegenwartsformen. Du kommst erst weiter, wenn alles richtig ist.</p>
    <div class="row"><button class="btn primary" id="go">⚡ Start the machine</button><button class="btn" onclick="rules()">📘 Read the manual</button></div>
  </div>`;
  $("go").onclick = () => { S = { nr: me(), st: 0, mistakes: 0, total: TOTAL, start: Date.now(), end: 0, done: false }; item = 0; save(); rules(); warp(render); };
}
function warp(cb, text) { const w = document.createElement("div"); w.className = "warp"; w.textContent = text || ""; document.body.appendChild(w); setTimeout(cb, 500); setTimeout(() => w.remove(), 1400); }
function resume() {
  $("app").innerHTML = `${header()}<div class="panel"><h2>Welcome back!</h2><p>Someone has already started on this iPad. – Hier hat schon jemand angefangen.</p>
  <div class="row"><button class="btn primary" id="c">Continue</button><button class="btn" id="n">I'm a new player</button></div></div>`;
  $("c").onclick = () => { item = 0; render(); }; $("n").onclick = () => { S = null; try { sessionStorage.removeItem(KEY); } catch (e) { } intro(); };
}

function render() {
  if (S.done) return finish();
  const st = ST[S.st];
  document.body.className = st.era === "then" ? "then" : st.era === "now" ? "now" : "";
  const eraLabel = st.era === "then" ? "📜 1870" : st.era === "now" ? "📱 TODAY" : "🔧 THE LAB";
  const dots = `<div class="dots">${st.items.map((_, i) => `<i class="${i < item ? "done" : i === item ? "now" : ""}"></i>`).join("")}</div>`;
  $("app").innerHTML = `${header()}<div class="panel">
    <span class="era ${st.era}">${eraLabel}</span><h2>${st.title}</h2>
    <div class="npc"><div class="ic">${st.npc[0]}</div><div><b>${st.npc[1]}:</b> “${st.npc[2]}”</div></div>
    <div class="task">${st.task}</div><div class="de">${st.de}</div>${st.type === "sort" ? "" : dots}
    <div id="ex"></div><div class="fb" id="fb"></div></div>`;
  ({ sort: rSort, pick: rPick, type: rType, order: rOrder })[st.type](st);
}
function next() { item++; if (item < ST[S.st].items.length) render(); else partFound(); }
function partFound() {
  const i = S.st;
  S.st++; if (S.st >= ST.length) { S.done = true; S.end = Date.now(); }
  save();
  $("app").innerHTML = `${header()}<div class="panel center">
    <div style="font-size:70px">${PARTS[i]}</div><h2>You found the ${PARTNAME[i]}!</h2>
    <p>${S.done ? "All parts are in place. Time to go home!" : `${PARTS.length - S.st} parts to go. Hold on tight …`}</p>
    <button class="btn primary" id="go">${S.done ? "🏠 Fly home" : "⚡ Time jump!"}</button></div>`;
  $("go").onclick = () => { item = 0; warp(render, S.done ? "" : (ST[S.st].era === "then" ? "1870" : ST[S.st].era === "now" ? "TODAY" : "")); };
}

/* ----- Typ: Sortieren ----- */
function rSort(st) {
  const left = st.items.map((x, i) => i).filter(i => !(S.sorted || []).includes(i));
  if (!S.sorted) S.sorted = [];
  if (!left.length) { S.sorted = []; save(); return partFound(); }
  const cur = left[0], it = st.items[cur];
  $("ex").innerHTML = `<div class="card center"><b>“${it[0]}”</b></div>
   <div class="small center">${st.items.length - left.length + 1} / ${st.items.length}</div>
   <div class="bins"><div class="bin" data-k="ab">💪 Ability<small>Fähigkeit – können</small></div><div class="bin" data-k="pe">✅ Permission<small>Erlaubnis – dürfen</small></div><div class="bin" data-k="ob">📋 Obligation<small>Pflicht – müssen</small></div></div>`;
  let locked = false;
  document.querySelectorAll(".bin").forEach(b => b.onclick = () => {
    if (locked) return;
    if (b.dataset.k === it[1]) { locked = true; b.classList.add("btn", "right"); S.sorted.push(cur); save(); fb("✔ Correct!", true); setTimeout(render, 800); }
    else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("btn", "wrong"); mistake();
      fb("✘ Think again: Can you DO it? Are you ALLOWED to do it? Or do you HAVE TO do it? <span class='de'>Kannst du es? Darfst du es? Musst du es?</span>"); }
  });
}
/* ----- Typ: Auswahl ----- */
function rPick(st) {
  const it = st.items[item], [pre, post] = it[0].split("___");
  $("ex").innerHTML = `<div class="card">${pre}<span class="gap" id="gap">&nbsp;?&nbsp;</span>${post}</div>
    <div class="opts">${shuffle(it[1].map((o, i) => [o, i])).map(([o, i]) => `<button class="btn" data-i="${i}">${o}</button>`).join("")}</div>`;
  let locked = false;
  document.querySelectorAll(".opts .btn").forEach(b => b.onclick = () => {
    if (locked) return;
    if (+b.dataset.i === it[2]) { locked = true; b.classList.add("right"); $("gap").textContent = it[1][it[2]]; $("gap").classList.add("ok"); fb("✔ Correct!", true); setTimeout(next, 1000); }
    else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); mistake(); fb("✘ " + hint(st.era, b.textContent)); }
  });
}
function hint(era, chosen) {
  if (era === "then" && /^(must|can't|have to|has to|don't|are|is|am)/.test(chosen)) return "That's present! We're in 1870. <span class='de'>Das ist Gegenwart – wir sind in der Vergangenheit!</span>";
  if (era === "now" && /^(had|didn't|were|was|could)/.test(chosen)) return "That's past! We're in the present now. <span class='de'>Das ist Vergangenheit – wir sind jetzt in der Gegenwart!</span>";
  if (/must|mustn't/.test(chosen)) return "Remember: in negative sentences and in the past we use have to. <span class='de'>Bei must brauchst du verneint und in der Vergangenheit die Ersatzform.</span>";
  return "Think: can (Fähigkeit), allowed to (Erlaubnis) or have to (Pflicht)? Check the form, too. <span class='de'>Was ist gemeint – und stimmt die Form?</span>";
}
/* ----- Typ: Eintippen ----- */
function rType(st) {
  const it = st.items[item], [pre, post] = it[1].split("___");
  $("ex").innerHTML = `<div class="card"><div style="color:var(--now)">📱 ${it[0]}</div><div style="color:var(--then);margin-top:8px">📜 ${pre}<input class="ty" id="ty" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${post}</div></div>
    <button class="btn primary" id="chk">Check</button>`;
  $("ty").focus();
  let locked = false;
  const go = () => {
    if (locked) return; const v = norm($("ty").value); if (!v) return;
    if (it[2].map(norm).includes(v)) { locked = true; $("ty").classList.add("ok"); $("ty").readOnly = true; fb("✔ Correct!" + (it[2].length > 1 ? ` <span class="small">Also possible: ${it[2].filter(x => norm(x) !== v).slice(0, 2).join(" / ")}</span>` : ""), true); setTimeout(next, 1600); }
    else {
      const t = $("ty"); t.classList.remove("bad"); void t.offsetWidth; t.classList.add("bad"); mistake();
      let h = "Not quite. Use a past form. <span class='de'>Benutze eine Vergangenheitsform.</span>";
      if (/must/.test(v)) h = "must has no past form! Use the substitute. <span class='de'>must hat keine Vergangenheit – nimm die Ersatzform.</span>";
      else if (/^(can|can't|cannot|don't|doesn't|have|has|are|is|am)\b/.test(v)) h = "That's present. It's 1870! <span class='de'>Das ist Gegenwart.</span>";
      else if (/allowed|able/.test(v) && !/to$/.test(v)) h = "Don't forget <b>to</b>! <span class='de'>Das „to“ fehlt.</span>";
      fb("✘ " + h);
    }
  };
  $("chk").onclick = go; $("ty").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
/* ----- Typ: Satzbau ----- */
function rOrder(st) {
  const target = st.items[item];
  let pool = shuffle(target.map(w => ({ w }))), t = 0, ans = [];
  while (pool.map(x => x.w).join(" ") === target.join(" ") && t++ < 10) pool = shuffle(pool);
  $("ex").innerHTML = `<div class="answerline" id="al"></div><div class="pool" id="pl"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="chk">Check</button><button class="btn" id="rs">Reset</button></div>`;
  const draw = () => {
    $("al").innerHTML = ans.map((x, k) => `<span class="chip" data-k="${k}">${x.w}</span>`).join("");
    $("pl").innerHTML = pool.map((x, k) => `<span class="chip" data-k="${k}">${x.w}</span>`).join("");
    document.querySelectorAll("#pl .chip").forEach(c => c.onclick = () => { ans.push(pool.splice(+c.dataset.k, 1)[0]); $("al").className = "answerline"; draw(); });
    document.querySelectorAll("#al .chip").forEach(c => c.onclick = () => { pool.push(ans.splice(+c.dataset.k, 1)[0]); $("al").className = "answerline"; draw(); });
  };
  draw(); let locked = false;
  $("rs").onclick = () => { if (locked) return; pool = pool.concat(ans); ans = []; draw(); };
  $("chk").onclick = () => {
    if (locked) return;
    if (pool.length) return fb("Use all the words. – Benutze alle Wörter.");
    if (ans.map(x => x.w).join(" ") === target.join(" ")) { locked = true; $("al").className = "answerline right"; fb("✔ Correct!", true); setTimeout(next, 1000); }
    else { const a = $("al"); a.className = "answerline"; void a.offsetWidth; a.className = "answerline wrong"; mistake(); fb("✘ Not quite. Questions in the past start with <b>Did</b>. <span class='de'>Prüfe die Reihenfolge.</span>"); }
  };
}
